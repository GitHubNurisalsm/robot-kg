{% if rows %}
  <ul class="hbars">
    {% for r in rows %}
      <li class="hbar" tabindex="0" data-tip-value="{{ r.display }}" data-tip-label="{{ r.label }}{% if r.extra %} · {{ r.extra }}{% endif %}">
        <span class="hbar-label">{{ r.label }}</span>
        <span class="hbar-track" aria-hidden="true"><span class="hbar-fill" style="width: {{ r.pct|stringformat:'s' }}%"></span></span>
        <span class="hbar-value">{{ r.display }}</span>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="viz-empty">{{ empty|default:"Нет данных за период." }}</p>
{% endif %}
