# nginx для Robot.KG.
# Установка: sudo cp deploy/nginx-robot-kg.conf /etc/nginx/sites-available/robot-kg
#            sudo ln -s /etc/nginx/sites-available/robot-kg /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
# HTTPS потом добавит certbot: sudo certbot --nginx -d robot.kg -d www.robot.kg

server {
    listen 80;
    server_name robot.kg www.robot.kg;

    # Совпадает с DATA_UPLOAD_MAX_MEMORY_SIZE (5 МБ) + запас на поля формы.
    client_max_body_size 6m;

    location /static/ {
        alias /srv/robot-kg/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /srv/robot-kg/media/;
        # Загруженные файлы никогда не исполняются и не отдаются как HTML.
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://unix:/run/robot-kg/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ВАЖНО: всегда перезаписываем заголовок — на него опирается
        # SECURE_PROXY_SSL_HEADER в config/settings.py.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
